<!DOCTYPE html>
<html lang="en">
<head>
  <title>YES 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #ff9a9e, #ff4d6d, #c9184a);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      color: white;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      font-size: clamp(36px, 7vw, 64px);
      animation: pulseGlow 1.5s infinite;
      text-shadow: 0 0 20px rgba(255,255,255,0.6);
    }

    @keyframes pulseGlow {
      0% { transform: scale(1); }
      50% { transform: scale(1.08); }
      100% { transform: scale(1); }
    }

    p {
      font-size: 18px;
      max-width: 90%;
    }

    button {
      margin-top: 35px;
      padding: 14px 32px;
      border-radius: 30px;
      border: none;
      font-size: 18px;
      cursor: pointer;
      background: white;
      color: #c9184a;
      font-weight: bold;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    .heart {
      position: fixed;
      bottom: -20px;
      font-size: 24px;
      animation: floatUp 6s linear infinite;
    }

    @keyframes floatUp {
      0% { transform: translateY(0) scale(0.8); opacity: 0; }
      20% { opacity: 1; }
      100% { transform: translateY(-120vh) scale(1.4); opacity: 0; }
    }
  </style>
</head>

<body>

  <!-- MUSIC -->
  <audio id="yesMusic">
    <source src="music.mp3" type="audio/mpeg">
  </audio>

  <h1 id="msg"></h1>
  <p>My heart just did backflips 🥹💖</p>

  <button onclick="goStory()">Tap to continue 💕</button>

  <script>
    const name =
      new URLSearchParams(window.location.search).get("name") || "You";

    document.getElementById("msg").innerText =
      `${name}, YOU SAID YES 😍💘`;

    const music = document.getElementById("yesMusic");

    // 🔑 MUSIC FIX (plays on first click)
    window.addEventListener("click", () => {
      if (sessionStorage.getItem("playMusic") === "yes") {
        music.volume = 0.4;
        music.play().catch(() => {});
        sessionStorage.removeItem("playMusic");
      }
    }, { once: true });

    function goStory() {
      window.location.href = "story.html?name=" + name;
    }

    // Floating hearts
    const hearts = ["💖","💘","💕","💗","💓"];
    setInterval(() => {
      const h = document.createElement("div");
      h.className = "heart";
      h.innerText = hearts[Math.floor(Math.random() * hearts.length)];
      h.style.left = Math.random() * 100 + "vw";
      document.body.appendChild(h);
      setTimeout(() => h.remove(), 7000);
    }, 300);
  </script>

</body>
</html>
