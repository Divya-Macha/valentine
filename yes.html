<!DOCTYPE html>
<html lang="en">
<head>
  <title>Yes 💖</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      background: radial-gradient(circle at top, #2b0f1e, #120008);
      font-family: "Georgia", serif;
      color: white;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    /* Soft moving light */
    body::before {
      content: "";
      position: absolute;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(255,255,255,0.06), transparent 60%);
      animation: lightMove 18s linear infinite;
    }

    @keyframes lightMove {
      from { transform: translate(-30%, -30%); }
      to { transform: translate(30%, 30%); }
    }

    .scene {
      position: relative;
      z-index: 2;
      max-width: 700px;
      padding: 20px;
      animation: fadeIn 2.5s ease forwards;
      opacity: 0;
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }

    h1 {
      font-size: clamp(32px, 6vw, 60px);
      letter-spacing: 2px;
      margin-bottom: 20px;
      text-shadow: 0 0 25px rgba(255, 120, 160, 0.5);
    }

    .line {
      font-size: 18px;
      line-height: 1.8;
      opacity: 0;
      animation: textReveal 2s ease forwards;
    }

    .line:nth-child(2) { animation-delay: 2s; }
    .line:nth-child(3) { animation-delay: 4s; }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(-6px);
      }
    }

    .divider {
      width: 80px;
      height: 2px;
      background: linear-gradient(to right, transparent, #ff7aa2, transparent);
      margin: 30px auto;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 1.5s;
    }

    button {
      margin-top: 40px;
      padding: 14px 36px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: white;
      font-size: 16px;
      letter-spacing: 1px;
      cursor: pointer;
      backdrop-filter: blur(6px);
      transition: all 0.3s ease;
      opacity: 0;
      animation: fadeIn 2s ease forwards;
      animation-delay: 6s;
    }

    button:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.08);
      box-shadow: 0 0 30px rgba(255,120,160,0.6);
    }

    /* Floating cinematic particles */
    .particle {
      position: fixed;
      width: 2px;
      height: 2px;
      background: rgba(255,255,255,0.6);
      animation: drift linear infinite;
    }

    @keyframes drift {
      from {
        transform: translateY(100vh);
        opacity: 0;
      }
      to {
        transform: translateY(-120vh);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <div class="scene">
    <h1 id="title"></h1>

    <div class="divider"></div>

    <div class="line">
      In that one moment…  
      everything slowed down.
    </div>

    <div class="line">
      And suddenly, the world felt softer, warmer, brighter.
    </div>

    <div class="line">
      Because you chose us.
    </div>

    <button onclick="goStory()">Continue the story →</button>
  </div>

  <script>
    const name =
      new URLSearchParams(window.location.search).get("name") || "You";

    document.getElementById("title").innerText =
      `${name}, you said YES`;

    function goStory() {
      window.location.href = "story.html?name=" + name;
    }

    // Cinematic floating particles
    for (let i = 0; i < 60; i++) {
      const p = document.createElement("div");
      p.className = "particle";
      p.style.left = Math.random() * 100 + "vw";
      p.style.animationDuration = (Math.random() * 12 + 8) + "s";
      p.style.opacity = Math.random();
      document.body.appendChild(p);
    }
  </script>

</body>
</html>
