<!DOCTYPE html>
<html>
<head>
  <title>YAY 💖</title>
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(135deg, #ff4d6d, #ff9a9e);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-family: "Segoe UI", sans-serif;
      color: white;
      overflow: hidden;
      text-align: center;
    }

    h1 {
      font-size: 48px;
      animation: bounce 1s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-15px); }
    }

    .confetti {
      position: fixed;
      width: 10px;
      height: 10px;
      background: white;
      animation: fall 3s linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    button {
      margin-top: 30px;
      padding: 12px 25px;
      border-radius: 25px;
      border: none;
      font-size: 16px;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h1 id="msg"></h1>
<p>You just made my heart explode 💕🥹</p>

<audio autoplay loop>
  <source src="music.mp3" type="audio/mpeg">
</audio>

<button onclick="goStory()">Our Story 📖</button>

<script>
  const name = new URLSearchParams(window.location.search).get("name") || "You";
  document.getElementById("msg").innerText = `YAYYYY ${name} 😍💖`;

  function goStory() {
    window.location.href = "story.html?name=" + name;
  }

  for (let i = 0; i < 40; i++) {
    const confetti = document.createElement("div");
    confetti.className = "confetti";
    confetti.style.left = Math.random() * 100 + "vw";
    confetti.style.background =
      ["#fff", "#ffeb3b", "#ff4081"][Math.floor(Math.random() * 3)];
    confetti.style.animationDuration = (Math.random() * 2 + 2) + "s";
    document.body.appendChild(confetti);
  }

  // 🎵 Romantic background music using Web Audio API
let audioCtx;

function startMusic() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    const notes = [261.63, 293.66, 329.63, 392.00, 440.00]; // C D E G A
    let index = 0;

    setInterval(() => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = "sine";
      osc.frequency.value = notes[index % notes.length];

      gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.15, audioCtx.currentTime + 0.1);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 1);

      osc.connect(gain);
      gain.connect(audioCtx.destination);

      osc.start();
      osc.stop(audioCtx.currentTime + 1);

      index++;
    }, 900);
  }
}

</script>

</body>
</html>
