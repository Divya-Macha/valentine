<!DOCTYPE html>
<html>
<head>
  <title>Plans</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      background: #08030a;
      font-family: Georgia, serif;
      color: white;
      padding: 60px 20px;
      text-align: center;
    }

    h2 {
      margin-top: 60px;
      font-weight: normal;
      letter-spacing: 1px;
    }

    p {
      max-width: 600px;
      margin: 15px auto;
      opacity: 0.85;
    }

    button {
      margin-top: 60px;
      padding: 14px 40px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.5);
      background: transparent;
      color: white;
      cursor: pointer;
    }
  </style>
</head>

<body>

<h2>Chapter I</h2>
<p>A long bike ride. Roads with no plans.</p>

<h2>Chapter II</h2>
<p>A beach. Where time forgets us.</p>

<h2>Chapter III</h2>
<p>A quiet resort. Just us and nothing else.</p>

<button onclick="next()">One last thing →</button>

<script>
  const name =
    new URLSearchParams(window.location.search).get("name") || "You";

  function next() {
    window.location.href = "letter.html?name=" + name;
  }
</script>

</body>
</html>
