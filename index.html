<!DOCTYPE html>
<html>
<head>
  <title>A Question</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      height: 100vh;
      background: linear-gradient(180deg, #08030a, #1a0b14);
      font-family: Georgia, serif;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .scene {
      max-width: 700px;
      padding: 20px;
      animation: fadeIn 2s forwards;
      opacity: 0;
    }

    h1 {
      font-size: clamp(28px, 5vw, 52px);
      letter-spacing: 2px;
      margin-bottom: 30px;
    }

    p {
      font-size: 18px;
      opacity: 0.85;
      line-height: 1.8;
    }

    button {
      margin: 25px;
      padding: 14px 36px;
      border-radius: 40px;
      border: 1px solid rgba(255,255,255,0.4);
      background: transparent;
      color: white;
      font-size: 16px;
      cursor: pointer;
      transition: all 0.3s ease;
    }

    button:hover {
      background: rgba(255,255,255,0.15);
      transform: scale(1.05);
    }

    @keyframes fadeIn {
      to { opacity: 1; }
    }
  </style>
</head>

<body>

<div class="scene">
  <h1 id="question"></h1>
  <p>
    This question has been waiting for you.<br>
    Not rushed. Not forced.<br>
    Just honest.
  </p>

  <button onclick="yes()">Yes</button>
  <button onclick="no()">No</button>
</div>

<script>
  const name =
    new URLSearchParams(window.location.search).get("name") || "You";

  document.getElementById("question").innerText =
    `${name}, will you be my Valentine?`;

  function yes() {
    window.location.href = "yes.html?name=" + name;
  }

  function no() {
    alert("That button doesn’t really want to be clicked.");
  }
</script>

</body>
</html>
